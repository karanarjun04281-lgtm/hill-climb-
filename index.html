<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ridge Runner Valley - Hill Climb Racing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Arial', sans-serif;
            background: #1a1a2e;
            color: #fff;
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #87ceeb 0%, #e0f6ff 100%);
        }

        .menu-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .menu-container.active {
            display: flex;
        }

        .menu-content {
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            max-width: 500px;
            width: 90%;
        }

        .game-title {
            font-size: 48px;
            color: #ffd700;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .game-subtitle {
            font-size: 18px;
            color: #87ceeb;
            margin-bottom: 30px;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .menu-btn {
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .primary-btn {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #000;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }

        .primary-btn:hover {
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.5);
            transform: scale(1.05);
        }

        .secondary-btn {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #fff;
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
        }

        .secondary-btn:hover {
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.5);
            transform: scale(1.05);
        }

        .menu-stats {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
        }

        .stat-item {
            font-size: 14px;
            color: #87ceeb;
            font-weight: bold;
        }

        .stat-item span {
            color: #ffd700;
        }

        .hud-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hud-container.hidden {
            display: none;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            pointer-events: auto;
        }

        .hud-left, .hud-right {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .hud-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .hud-item {
            font-size: 14px;
            color: #fff;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 12px;
            border-radius: 5px;
        }

        .hud-label {
            color: #87ceeb;
        }

        .hud-btn {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #fff;
            padding: 8px 16px;
            font-size: 12px;
            border-radius: 5px;
            pointer-events: auto;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }

        .hud-btn:hover {
            transform: scale(1.05);
        }

        .hud-fuel-bar {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 150px;
            height: 30px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #ffd700;
            border-radius: 5px;
            overflow: hidden;
            pointer-events: none;
        }

        .fuel-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b 0%, #ffed4e 50%, #00ff00 100%);
            width: 100%;
            transition: width 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fuel-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            font-weight: bold;
            color: #000;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
            z-index: 1;
            pointer-events: none;
        }

        .overlay-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 150;
            pointer-events: all;
        }

        .overlay-menu.hidden {
            display: none;
        }

        .pause-content, .game-over-content {
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            min-width: 300px;
        }

        .pause-content h2, .game-over-content h2 {
            font-size: 40px;
            color: #ffd700;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .game-over-stats {
            background: rgba(0, 212, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
            color: #fff;
        }

        .stat-label {
            color: #87ceeb;
            margin-right: 20px;
        }

        .pause-content button, .game-over-content button {
            display: block;
            width: 100%;
            margin-top: 15px;
        }

        .mobile-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.7) 100%);
            display: flex;
            gap: 10px;
            padding: 20px;
            z-index: 75;
            pointer-events: auto;
        }

        .mobile-controls.hidden {
            display: none;
        }

        .mobile-btn {
            flex: 1;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
        }

        .accel-btn {
            background: linear-gradient(135deg, #00ff00 0%, #00dd00 100%);
            color: #000;
        }

        .brake-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: #fff;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- Main Menu -->
    <div id="mainMenu" class="menu-container active">
        <div class="menu-content">
            <h1 class="game-title">🏁 Ridge Runner</h1>
            <p class="game-subtitle">Hill Climb Racing Adventure</p>
            <div class="menu-buttons">
                <button id="playBtn" class="menu-btn primary-btn">▶ PLAY</button>
                <button id="garageBtn" class="menu-btn secondary-btn">🔧 GARAGE</button>
            </div>
            <div class="menu-stats">
                <div class="stat-item">💰 Coins: <span id="menuCoins">0</span></div>
                <div class="stat-item">📏 Best: <span id="menuBestDistance">0</span>m</div>
            </div>
        </div>
    </div>

    <!-- Game HUD -->
    <div id="gameHUD" class="hud-container hidden">
        <div class="hud-top">
            <div class="hud-left">
                <div class="hud-item"><span class="hud-label">📏</span> <span id="distanceDisplay">0</span>m</div>
                <div class="hud-item"><span class="hud-label">💰</span> <span id="coinsDisplay">0</span></div>
            </div>
            <div class="hud-center" id="stageDisplay">Green Valley</div>
            <div class="hud-right">
                <button id="pauseBtn" class="hud-btn">⏸ PAUSE</button>
            </div>
        </div>
        <div class="hud-fuel-bar">
            <div id="fuelBar" class="fuel-bar-inner" style="width: 100%;"></div>
            <span class="fuel-label">FUEL</span>
        </div>
    </div>

    <!-- Pause Menu -->
    <div id="pauseMenu" class="overlay-menu hidden">
        <div class="pause-content">
            <h2>⏸ PAUSED</h2>
            <button id="resumeBtn" class="menu-btn primary-btn">▶ RESUME</button>
            <button id="restartBtn" class="menu-btn secondary-btn">🔄 RESTART</button>
            <button id="menuBtn" class="menu-btn secondary-btn">🏠 MENU</button>
        </div>
    </div>

    <!-- Game Over Menu -->
    <div id="gameOverMenu" class="overlay-menu hidden">
        <div class="game-over-content">
            <h2 id="gameOverTitle">🎮 GAME OVER!</h2>
            <div class="game-over-stats">
                <div class="stat"><span class="stat-label">📏 Distance:</span> <span id="finalDistance">0</span>m</div>
                <div class="stat"><span class="stat-label">💰 Coins:</span> <span id="finalCoins">0</span></div>
                <div class="stat"><span class="stat-label">🎯 Score:</span> <span id="finalScore">0</span></div>
            </div>
            <button id="gameOverRestartBtn" class="menu-btn primary-btn">🔄 TRY AGAIN</button>
            <button id="gameOverMenuBtn" class="menu-btn secondary-btn">🏠 MENU</button>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobileControls" class="mobile-controls hidden">
        <button id="mobileAccel" class="mobile-btn accel-btn">⬆️ ACCELERATE</button>
        <button id="mobileBrake" class="mobile-btn brake-btn">⬇️ BRAKE</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
